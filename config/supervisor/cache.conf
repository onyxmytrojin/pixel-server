[program:cache-node-a]
command=/var/www/phoneix/cache/cache-node --id=node-a --port=6001 --peers node-b=localhost:6002,node-c=localhost:6003
directory=/var/www/phoneix/cache
autostart=true
autorestart=true
startretries=5
stopwaitsecs=5
stdout_logfile=/var/www/phoneix/cache/logs/node-a.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/www/phoneix/cache/logs/node-a.err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

